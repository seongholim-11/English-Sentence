<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>링고루프</title>
<style>
  :root { --bg:#F3F3EF; --ink:#16181D; --muted:#5E626B; --line:#D9D9D2; --accent:#2F5BFF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161A; --ink:#ECECE8; --muted:#9A9EA6; --line:#2C2F36; --accent:#7D9BFF; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:680px; margin:0 auto; padding:48px 20px 64px; }
  h1 { font-size:28px; margin:0 0 4px; }
  p { margin:6px 0; }
  .meta { color:var(--muted); }
  ul { list-style:none; padding:0; margin:28px 0 0; }
  li { margin:10px 0; }
  a { display:block; padding:14px 16px; border:1px solid var(--line); border-radius:14px; color:var(--accent); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>링고루프</h1>
  <p class="meta">영어 단어·구동사·문장·대화문을 반복해서 익히는 영어 회독 앱</p>
  <ul>
    <li><a href="support/">지원 · 자주 묻는 질문</a></li>
    <li><a href="privacy/">개인정보처리방침</a></li>
  </ul>
</main>
</body>
</html>
